<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바론링크 | 관리대장 색인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --paper: #F2EFE6;
    --paper-dim: #EAE6D9;
    --ink: #20262B;
    --ink-soft: #5B6470;
    --ink-faint: #93998F;
    --line: #D9D3C1;
    --navy: #23262B;
    --stamp: #A9790E;
    --brass: #A9790E;
    --card: #FCFBF7;
    --radius: 3px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 100% 0%, #FFFFFF60, transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:860px;
    margin:0 auto;
    padding:56px 24px 120px;
  }

  /* ---------- Header ---------- */
  header{
    margin-bottom:40px;
    border-bottom:1px solid var(--line);
    padding-bottom:28px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:"";
    width:16px; height:1px;
    background:var(--stamp);
    display:inline-block;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .logo-box{
    width:34px; height:34px;
    background:var(--navy);
    border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .logo-box svg{ width:17px; height:23px; }
  .title-row{
    display:flex;
    align-items:baseline;
    gap:2px;
  }
  h1{
    font-family:'Pretendard', sans-serif;
    font-weight:800;
    font-size:42px;
    letter-spacing:-0.03em;
    margin:0;
    color:var(--ink);
  }
  .sub{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 26px;
    line-height:1.6;
  }
  .search{
    position:relative;
    max-width:420px;
  }
  .search input{
    width:100%;
    padding:12px 14px 12px 38px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--card);
    font-family:'Pretendard', sans-serif;
    font-size:14px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search input:focus{ border-color:var(--stamp); }
  .search svg{
    position:absolute; left:12px; top:50%;
    transform:translateY(-50%);
    width:15px; height:15px;
    stroke:var(--ink-faint);
  }

  /* ---------- Branch cards ---------- */
  #branches{ display:flex; flex-direction:column; gap:22px; }

  .branch-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 1px 0 rgba(32,38,43,0.02);
  }

  .branch-head{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    background:
      linear-gradient(180deg, #FFFFFF, #FBF9F4);
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  .branch-head::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:var(--brass);
    opacity:.55;
  }
  .branch-title{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .branch-title h2{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.02em;
    margin:0;
    color:var(--ink);
  }
  .branch-count{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-faint);
  }

  /* 준비중 배지 */
  .soon-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    color:var(--ink-faint);
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px 9px;
    flex-shrink:0;
  }
  .branch-head.disabled{ cursor:default; }
  .branch-head.disabled .branch-title h2{ color:var(--ink-faint); }

  /* 바로가기(단일 링크) 카드: 카드 전체가 링크 */
  a.branch-head-link{
    text-decoration:none;
    color:inherit;
    display:flex;
  }

  .doc-icon{
    width:30px; height:30px;
    flex-shrink:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper-dim);
    border:1px solid var(--line);
  }
  .doc-icon svg{ width:15px; height:15px; stroke:var(--ink-soft); }

  .go{
    width:24px; height:24px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .go svg{ width:11px; height:11px; stroke:var(--ink-soft); }

  /* ---------- 카테고리 구획 제목 ---------- */
  .section-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:.1em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin:34px 0 10px;
  }
  .section-label:first-child{ margin-top:0; }

  .no-match{
    text-align:center;
    padding:32px;
    color:var(--ink-faint);
    font-size:13px;
    display:none;
  }

  footer{
    margin-top:56px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-faint);
    display:flex;
    justify-content:space-between;
  }

  @media (max-width:520px){
    .wrap{ padding:36px 16px 90px; }
    h1{ font-size:32px; }
    .branch-head{ padding:14px 16px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">바론네트웍스 · 총무팀</div>
    <div class="brandmark">
      <div class="logo-box">
        <svg viewBox="0 0 20 28" fill="none"><path d="M13 0H20L7 28H0L13 0Z" fill="#D9A62E"/></svg>
      </div>
      <div class="title-row"><h1>바론링크</h1></div>
    </div>
    <p class="sub">항목을 클릭하면 해당 대장/앱으로 이동합니다. 앱 접속 권한이 필요하신 분은 총무팀으로 문의해주세요.</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="대장 이름 검색 (예: 시설, 셔틀)">
    </div>
  </header>

  <div id="branches"></div>
  <div class="no-match" id="noMatch">검색 결과가 없습니다.</div>

  <footer>
    <span>VARON-LINKS</span>
    <span id="countLabel"></span>
  </footer>
</div>

<script>
/* 예전엔 Supabase(외부 DB)에서 이 목록을 불러왔는데, 그 프로젝트가 없어져서
   더는 연결이 안 됐다(관리자 퇴사 시 개인 계정 프로젝트가 같이 사라짐 — 이 조직 소속이 아니었음).
   그래서 목록을 이 파일 안에 직접 적어두는 방식으로 바꿨다.
   링크를 추가·삭제·순서 변경하려면 아래 LINKS 배열만 고치면 된다. */
const iconPaths = {
  '시설': '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  '청소': '<path d="M3 21l6-6M14 3l7 7-8.5 8.5a4.95 4.95 0 1 1-7-7L14 3z"/>',
  '셔틀': '<rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/><path d="M3 12h18"/>',
  '소모품': '<path d="M21 8L12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  '강사': '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/>',
  '분원정보': '<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 6V4h12v2"/>',
  '노선': '<path d="M9 20l-5-2V6l5 2m0 12l6-2m-6 2V8m6 10l5 2V8l-5-2m0 12V6m0 0L9 8"/>',
  '차량': '<rect x="3" y="11" width="18" height="7" rx="2"/><path d="M5 11l1.5-5h11L19 11"/><circle cx="7.5" cy="18" r="1.6"/><circle cx="16.5" cy="18" r="1.6"/>',
  '총무': '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h5"/><path d="M9 13h6M9 17h6"/>',
  '매뉴얼': '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
  'default': '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h5"/>'
};
function iconFor(key){ return iconPaths[key] || iconPaths.default; }

const LINKS = [
  { section:'분원 운영', icon:'분원정보', title:'분원 기본정보·계정관리', url:'branch-info.html' },
  { section:'분원 운영', icon:'시설', title:'시설관리대장', url:'facility-log.html' },
  { section:'분원 운영', icon:'청소', title:'청소관리대장', url:'cleaning-log.html' },
  { section:'셔틀', icon:'셔틀', title:'셔틀 운영 대시보드', url:'shuttle-dashboard.html' },
  { section:'셔틀', icon:'노선', title:'셔틀 노선조정·감차 운영도구', url:'shuttle-sim.html' },
  { section:'인사', icon:'강사', title:'강사채용해임현황', url:'instructor-hiring.html' },
  { section:'총무', icon:'총무', title:'총무업무', url:'ga.html' },
  { section:'총무', icon:'소모품', title:'소모품관리대장', url:'inventory.html' },
  { section:'총무', icon:'차량', title:'차량·기사 서류정비 진행관리', url:'vehicle-docs.html' },
  { section:'매뉴얼', icon:'매뉴얼', title:'대관업무 매뉴얼', url:'gr.html' },
];

const branchesEl = document.getElementById('branches');
const noMatchEl = document.getElementById('noMatch');
const countLabel = document.getElementById('countLabel');
const searchInput = document.getElementById('searchInput');

function render(items){
  branchesEl.innerHTML = '';
  countLabel.textContent = items.length + ' LINKS';

  const bySection = {};
  items.forEach(it=>{ (bySection[it.section] = bySection[it.section] || []).push(it); });

  Object.keys(bySection).forEach(section=>{
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section;
    branchesEl.appendChild(label);

    bySection[section].forEach(it=>{
      const card = document.createElement('div');
      card.className = 'branch-card';
      const a = document.createElement('a');
      a.className = 'branch-head branch-head-link';
      a.href = it.url;
      a.dataset.search = (section + ' ' + it.title).toLowerCase();
      a.innerHTML = `
        <div class="branch-title">
          <div class="doc-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconFor(it.icon)}</svg></div>
          <h2>${it.title}</h2>
        </div>
        <div class="go"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg></div>
      `;
      card.appendChild(a);
      branchesEl.appendChild(card);
    });
  });
}

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = q ? LINKS.filter(it => (it.section+' '+it.title).toLowerCase().includes(q)) : LINKS;
  render(filtered);
  noMatchEl.style.display = filtered.length ? 'none' : 'block';
}
searchInput.addEventListener('input', applyFilter);

render(LINKS);
</script>
</body>
</html>
